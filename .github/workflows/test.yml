name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # pnpm version from packageManager in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      # The browsers are cached by Playwright version; their system packages (apt) install on each run
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./packages/astro-image-zoom/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter astro-image-zoom exec playwright install --with-deps chromium firefox webkit

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter astro-image-zoom exec playwright install-deps chromium firefox webkit

      - name: End-to-end tests
        run: pnpm test:e2e

      # Also when a flaky test passed on retry: the report keeps the trace of its first failure
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/astro-image-zoom/e2e/playwright-report/
          retention-days: 7
